<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ivo Pita - Login</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ✅ SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  window.SUPABASE_URL = 'https://cqvihtxgbzmgehdmqipr.supabase.co';
  window.SUPABASE_ANON_KEY = 'sb_publishable_n8JzHYyWSz_4QXTL_F6ZEw_N52k668d';
  window.supabaseClient = supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_ANON_KEY
  );
</script>

  <style>
    body {
      background: linear-gradient(135deg, #2f6b4f 0%, #1f4d38 100%);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin: 0;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #2f6b4f, #1f4d38);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: #ffffff;
      font-size: 28px;
      box-shadow: 0 8px 24px rgba(47, 107, 79, 0.4);
    }
    .input-field {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 1.5px solid #e5ebe7;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #fafcfb;
      transition: all 0.2s;
    }
    .input-field:focus {
      border-color: #2f6b4f;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(47, 107, 79, 0.12);
    }
    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #7d8a84;
      font-size: 14px;
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2f6b4f, #1f4d38);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 8px 20px rgba(47, 107, 79, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(47, 107, 79, 0.4);
    }
    .btn-login:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    .error-msg {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo">
      <i class="fas fa-gem"></i>
    </div>

    <h1 class="text-center text-2xl font-black text-gray-800 mb-1" style="color: #1f4d38;">
      IVO PITA
    </h1>
    <p class="text-center text-xs font-bold uppercase tracking-widest mb-8" style="color: #c9a86a;">
      Painel Administrativo
    </p>

    <div id="error-box" class="error-msg"></div>

    <form id="login-form">
      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-600 uppercase mb-2">Email</label>
        <div class="relative">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="login-email" class="input-field" placeholder="admin@ivopita.com" required
            autocomplete="email">
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-xs font-bold text-gray-600 uppercase mb-2">Senha</label>
        <div class="relative">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="login-senha" class="input-field" placeholder="••••••••" required
            autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="btn-login" class="btn-login">
        <i class="fas fa-sign-in-alt"></i>
        <span id="btn-login-text">Entrar</span>
      </button>
    </form>

    <p class="text-center text-[10px] text-gray-400 mt-6">
      © IVO PITA — Indústria de Joias
    </p>
  </div>

  <script>
    // ============================================
    // LOGIN — Supabase
    // ============================================
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const btnLogin = document.getElementById('btn-login');
    const btnLoginText = document.getElementById('btn-login-text');

    function mostrarErro(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('show');
    }

    function esconderErro() {
      errorBox.classList.remove('show');
    }

    // Se já estiver logado, vai direto pro admin
    (function () {
      const auth = sessionStorage.getItem('ivo_auth');
      if (auth) {
        try {
          const user = JSON.parse(auth);
          if (user.token && user.email && user.loginAt) {
            window.location.href = 'admin.html';
          }
        } catch (e) { }
      }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderErro();

      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const senha = document.getElementById('login-senha').value;

      if (!email || !senha) {
        return mostrarErro('Preencha email e senha.');
      }

      // Verifica se Supabase está carregado
      if (!window.supabaseClient) {
        return mostrarErro('Erro de configuração: Supabase não carregado. Verifique a anon key no HTML.');
      }

      btnLogin.disabled = true;
      btnLoginText.textContent = 'Entrando...';

      try {
        // Busca o usuário na tabela
        const { data, error } = await window.supabaseClient
          .from('usuarios')
          .select('id, email, nome, nivel, ativo, senha')
          .eq('email', email)
          .eq('ativo', true)
          .maybeSingle();

        if (error) {
          console.error('Erro Supabase:', error);
          throw new Error('Erro ao conectar: ' + error.message);
        }

        if (!data) {
          throw new Error('Email não encontrado ou usuário inativo.');
        }

        if (data.senha !== senha) {
          throw new Error('Senha incorreta.');
        }

        // ✅ Login OK — grava no sessionStorage no formato que o admin.html espera
        const authData = {
          token: crypto.randomUUID ? crypto.randomUUID() : ('tk_' + Date.now() + '_' + Math.random().toString(36).slice(2)),
          email: data.email,
          loginAt: Date.now(),
          nome: data.nome || '',
          nivel: data.nivel || 'admin',
          userId: data.id
        };

        sessionStorage.setItem('ivo_auth', JSON.stringify(authData));

        // Redireciona
        btnLoginText.textContent = 'Entrando...';
        window.location.href = 'admin.html';

      } catch (err) {
        console.error('Erro no login:', err);
        mostrarErro(err.message || 'Erro ao fazer login.');
        btnLogin.disabled = false;
        btnLoginText.textContent = 'Entrar';
      }
    });
  </script>
</body>

</html>
